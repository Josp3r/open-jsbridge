name: Release Android to Maven Central

on:
  workflow_dispatch:
    inputs:
      publishing_type:
        description: 'Maven Central publishing mode (AUTOMATIC publishes right after validation; USER_MANAGED waits for manual approval in Portal)'
        type: choice
        default: AUTOMATIC
        options:
          - AUTOMATIC
          - USER_MANAGED
      dry_run:
        description: 'Build and sign bundle without uploading to Sonatype Central Portal'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-android-maven-central
  cancel-in-progress: false

jobs:
  publish-android:
    name: Build, Sign, and Publish Android AAR
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate release configuration and secrets
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          sdk_version="$(sed -n 's/^val sdkVersion = "\([^"]*\)"/\1/p' examples/native-android/host/build.gradle.kts)"
          if [[ -z "$sdk_version" ]]; then
            echo "::error::Could not determine sdkVersion from examples/native-android/host/build.gradle.kts"
            exit 1
          fi
          echo "SDK_VERSION=$sdk_version" >> "$GITHUB_ENV"
          echo "Resolved Android SDK version: $sdk_version"

          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Missing secret SIGNING_KEY (ASCII-armored GPG private key)"
            exit 1
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ -z "$MAVEN_CENTRAL_USERNAME" || -z "$MAVEN_CENTRAL_PASSWORD" ]]; then
              echo "::error::Missing MAVEN_CENTRAL_USERNAME or MAVEN_CENTRAL_PASSWORD secret"
              exit 1
            fi
          fi

      - name: Build unsigned Maven Central bundle
        run: |
          set -euo pipefail
          ./examples/native-android/gradlew -p examples/native-android \
            --no-daemon --stacktrace :host:bundleUnsignedCentralRelease
          unsigned_zip="examples/native-android/host/build/central/open-jsbridge-android-${SDK_VERSION}-central-unsigned.zip"
          test -s "$unsigned_zip"
          unzip -l "$unsigned_zip"

      - name: GPG sign bundle artifacts and verify signatures
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_zip="$PWD/examples/native-android/host/build/central/open-jsbridge-android-${SDK_VERSION}-central-unsigned.zip"
          out_dir="$RUNNER_TEMP/central-signed"
          work_dir="$out_dir/unpacked"
          gnupg_home="$(mktemp -d)"
          chmod 700 "$gnupg_home"
          cleanup() {
            rm -rf "$gnupg_home"
          }
          trap cleanup EXIT

          export GNUPGHOME="$gnupg_home"
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import

          mkdir -p "$work_dir"
          unzip -q "$unsigned_zip" -d "$work_dir"

          coord_dir="$work_dir/io/github/josp3r/open-jsbridge-android/${SDK_VERSION}"
          prefix="open-jsbridge-android-${SDK_VERSION}"
          for suffix in .aar .pom .module -sources.jar -javadoc.jar; do
            target="${coord_dir}/${prefix}${suffix}"
            test -s "$target"
            if [[ -n "$SIGNING_PASSWORD" ]]; then
              gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 3 --armor --detach-sign \
                --output "${target}.asc" "$target" 3<<<"$SIGNING_PASSWORD"
            else
              gpg --batch --yes --armor --detach-sign \
                --output "${target}.asc" "$target"
            fi
            gpg --batch --verify "${target}.asc" "$target"
          done

          signed_zip="$out_dir/${prefix}-central-signed.zip"
          (cd "$work_dir" && zip -qr "$signed_zip" io)
          echo "SIGNED_ZIP=$signed_zip" >> "$GITHUB_ENV"
          echo "Signed bundle contents:"
          unzip -l "$signed_zip"

      - name: Upload signed bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: open-jsbridge-android-${{ env.SDK_VERSION }}-central-signed
          path: ${{ env.SIGNED_ZIP }}
          retention-days: 14

      - name: Upload and publish to Sonatype Central Portal
        if: ${{ !inputs.dry_run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          PUBLISHING_TYPE: ${{ inputs.publishing_type }}
        run: |
          set -euo pipefail
          auth_token="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          upload_url="https://central.sonatype.com/api/v1/publisher/upload?name=open-jsbridge-android-${SDK_VERSION}&publishingType=${PUBLISHING_TYPE}"

          response_file="$RUNNER_TEMP/central-upload-response.txt"
          http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${auth_token}" \
            -F "bundle=@${SIGNED_ZIP}" \
            "$upload_url")"

          deployment_id="$(cat "$response_file")"
          if [[ "$http_code" != "201" || -z "$deployment_id" ]]; then
            echo "::error::Central Portal upload failed (HTTP ${http_code}): ${deployment_id}"
            exit 1
          fi
          echo "Uploaded deployment ID: ${deployment_id} (mode: ${PUBLISHING_TYPE})"

          status_url="https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}"
          for attempt in $(seq 1 90); do
            status_json="$(curl -fsS -X POST -H "Authorization: Bearer ${auth_token}" "$status_url")"
            state="$(printf '%s' "$status_json" | jq -r '.deploymentState // "UNKNOWN"')"
            echo "Poll #${attempt}: deploymentState=${state}"

            case "$state" in
              PUBLISHED)
                echo "Published io.github.josp3r:open-jsbridge-android:${SDK_VERSION} to Maven Central!"
                exit 0
                ;;
              VALIDATED)
                if [[ "$PUBLISHING_TYPE" == "USER_MANAGED" ]]; then
                  echo "Bundle validated in Sonatype Central Portal (USER_MANAGED). Approve publication in Portal UI."
                  exit 0
                fi
                ;;
              FAILED)
                echo "::error::Central Portal validation/publishing failed:"
                printf '%s\n' "$status_json" | jq .
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for Central Portal deployment ${deployment_id}; check status in Portal UI."
          exit 1
