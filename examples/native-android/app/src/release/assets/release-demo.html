<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenJSBridge Android Release Demo</title>
<style>
  body { margin: 2rem 1rem; font: 1rem system-ui; color-scheme: light dark; }
  h1 { font-size: 1.5rem; }
  pre { white-space: pre-wrap; }
</style>
<h1>OpenJSBridge Android Release Demo</h1>
<pre id="bridge-results" aria-live="polite">Connecting to the native bridge…</pre>
<p id="config-event">Use the native Toggle theme button to send a config update.</p>
<script>
  async function showResults() {
    const output = document.querySelector('#bridge-results');
    const eventOutput = document.querySelector('#config-event');
    const eventName = 'acme.app.configChanged';
    const transport = window.__OJSB_TRANSPORT__;
    const replies = new Map();
    let sid;
    let device;
    let config;

    function render() {
      output.textContent = JSON.stringify({ device, config }, null, 2);
    }

    window.__OJSB_RECEIVE__ = raw => {
      const { meta, rpc } = JSON.parse(raw);
      if (rpc.method === 'bridge.event') {
        if (sid && meta?.sid === sid && rpc.params?.name === eventName) {
          config = rpc.params.payload;
          render();
          eventOutput.textContent = `${eventName}: ${config.theme}`;
        }
        return;
      }
      replies.get(rpc.id)?.(rpc);
    };

    async function request(id, method, params) {
      const frame = { jsb: '1.0', rpc: { jsonrpc: '2.0', id, method, params } };
      if (sid) frame.meta = { sid };
      let timeout;
      try {
        const reply = await new Promise((resolve, reject) => {
          replies.set(id, resolve);
          timeout = setTimeout(() => reject(new Error(`No reply for ${method}.`)), 5000);
          transport.postMessage(JSON.stringify(frame));
        });
        if (reply.error) throw new Error(reply.error.message);
        return reply.result;
      } finally {
        clearTimeout(timeout);
        replies.delete(id);
      }
    }

    try {
      if (!transport) throw new Error('The native transport is unavailable.');
      ({ sid } = await request('hello', 'bridge.hello', { protocols: [1] }));
      device = await request('device', 'device.getInfo@1', {});
      const { subscribed } = await request('subscribe', 'bridge.subscribe@1', { events: [eventName] });
      if (!subscribed.includes(eventName)) throw new Error(`Could not subscribe to ${eventName}.`);
      const initialConfig = await request('config', 'acme.app.getConfig@1', {});
      // A notification can update the config while the initial read is in flight.
      config ??= initialConfig;
      render();
      output.dataset.state = 'ready';
    } catch (error) {
      output.textContent = error.message;
      output.dataset.state = 'error';
    }
  }

  void showResults();
</script>
</html>
